services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: potlock
      POSTGRES_PASSWORD: potlock
      POSTGRES_DB: potlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potlock"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
